<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividadw</title>
    <script src="/script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Media</h1>

    <label for="nomeAluno">Nome do Aluno: </label><br>
    <input type="text" id="nomeAluno" name="nomeAluno"><br>

    <label for="n1">bote sua primeira nota: </label><br>
    <input type="number" id="n1" name="n1"><br>

    <label for="n2">bote sua segunda nota: </label><br>
    <input type="number" id="n2" name="n2"><br>

    <label for="n3">bote sua terceira nota: </label><br>
    <input type="number" id="n3" name="n3"><br>

    <p id="resultado"></p>

    <button onclick="calcularMedia()">Calcular Média</button>

    <h1>tabuada</h1>

    <label for="num">Insira um número: </label><br>
    <input type="number" id="num" name="num"><br>

    <p id="tabuada"></p>

    <button onclick="mostrarTabuada()">Mostrar Tabuada</button>
    <button onclick="limparTabuada()">Limpar</button>

    <h1>desconto</h1>

    <label for="preco">Preço do produto: </label><br>
    <input type="number" id="preco" name="preco"><br>

    <label for="desconto">Percentual de desconto: </label><br>
    <input type="number" id="desconto" name="desconto"><br>
    
    <p id="resultadoDesconto"></p>
    
    <button onclick="calcularDesconto()">Calcular Desconto</button>

    <h1>Alunos</h1>
</body>

</html>
